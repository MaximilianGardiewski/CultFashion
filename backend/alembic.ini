[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Die Verbindung kommt aus DATABASE_URL (siehe migrations/env.py),
# damit dieselbe Datei fuer SQLite und PostgreSQL gilt.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generisch

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generisch

[formatter_generisch]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
