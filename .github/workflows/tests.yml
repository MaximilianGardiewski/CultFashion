name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Dieselbe Testsuite gegen beide Datenbanken: SQLite ist der schnelle
    # Entwicklungsfall, PostgreSQL die Zielumgebung auf dem VPS.
    strategy:
      fail-fast: false
      matrix:
        datenbank: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventur
          POSTGRES_PASSWORD: inventur
          POSTGRES_DB: inventur_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.datenbank == 'postgres'
            && 'postgresql+psycopg2://inventur:inventur@localhost/inventur_test'
            || 'sqlite://' }}
        run: pytest -q

      - name: Migrationen bilden das Modell vollständig ab
        working-directory: backend
        env:
          DATABASE_URL: ${{ matrix.datenbank == 'postgres'
            && 'postgresql+psycopg2://inventur:inventur@localhost/inventur_mig'
            || 'sqlite:////tmp/mig.db' }}
        run: |
          if [ "${{ matrix.datenbank }}" = "postgres" ]; then
            PGPASSWORD=inventur createdb -h localhost -U inventur inventur_mig
          fi
          alembic upgrade head
          # Schlägt fehl, sobald jemand ein Modell ändert und die Migration vergisst
          alembic check
